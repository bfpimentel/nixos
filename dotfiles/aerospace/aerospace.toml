config-version = 2

start-at-login = true

auto-reload-config = true

key-mapping.preset = 'qwerty'

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 0

default-root-container-layout = 'tiles'
default-root-container-orientation = 'horizontal'

on-focused-monitor-changed = [ 'move-mouse monitor-lazy-center' ]

exec-on-workspace-change = [
  '/bin/bash',
  '-c',
  '/Users/bruno/.config/aerospace/handle-pip.sh'
]

after-startup-command = [
  'exec-and-forget /etc/profiles/per-user/bruno/bin/borders'
]

persistent-workspaces = [ 'B', 'W', 'M', 'T', 'X' ]

[exec.env-vars]
PATH = '/etc/profiles/per-user/bruno/bin/:/Users/bruno/.nix-profile/bin/:${PATH}'

[workspace-to-monitor-force-assignment]
T = [ 'secondary', 'main' ]
X = [ 'secondary', 'main' ]

[gaps]
outer.top =        0
outer.bottom =     0
outer.left =       0
outer.right =      0
inner.horizontal = 8
inner.vertical =   8

[mode.main.binding]
cmd-h = []
cmd-alt-h = []
cmd-m = []

alt-semicolon = [ 'mode service' ]

alt-b = 'workspace B'
alt-w = 'workspace W'
alt-m = 'workspace M'
alt-t = 'workspace T'
alt-x = 'workspace X'

alt-shift-b = 'move-node-to-workspace B'
alt-shift-w = 'move-node-to-workspace W'
alt-shift-m = 'move-node-to-workspace M'
alt-shift-t = 'move-node-to-workspace T'
alt-shift-x = 'move-node-to-workspace X'

alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

[mode.service.binding]
esc = [ 'mode main' ]
r = [ 'reload-config', 'mode main' ]
f = [ 'layout floating tiling' ]
m = "exec-and-forget osascript -e 'tell application \"System Events\" to tell dock preferences to set autohide menu bar to not (get autohide menu bar)'"

minus = 'resize smart -50'
equal = 'resize smart +50'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = ['layout floating']
check-further-callbacks = false

[[on-window-detected]]
if.app-id = 'cc.ffitch.shottr'
run = ['layout floating']
check-further-callbacks = false

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = ['layout tiling', 'move-node-to-workspace T']
check-further-callbacks = false

[[on-window-detected]]
if.window-title-regex-substring = 'Helium - Bruno'
run = ['move-node-to-workspace B']
check-further-callbacks = true

[[on-window-detected]]
if.window-title-regex-substring = 'Helium - Squibler'
run = ['move-node-to-workspace W']
check-further-callbacks = true

[[on-window-detected]]
if.app-id = 'net.imput.helium'
if.window-title-regex-substring = 'Picture in Picture'
run = ['layout floating']
check-further-callbacks = false

[[on-window-detected]]
if.app-id = 'net.imput.helium'
if.window-title-regex-substring = 'Bitwarden'
run = ['layout floating']
check-further-callbacks = false
