# Options
set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc,xterm-kitty:Tc"
set -as terminal-features ',xterm-kitty:extkeys'
set -g set-clipboard on

setw -g mouse on

set -sg escape-time 1

set -g focus-events on

set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set -g pane-border-lines heavy
set -g pane-border-indicators both

# Status
set-option -g status-style bg=default,fg='#D4BE98'
set-option -g status-position top

set -g status-interval 2
set -g status-justify left

set -g window-status-format '#[fg=#7C6F64]#I:#W'
set -g window-status-current-format '#[fg=#D4BE98]#I:#W'

set -g status-left ''
set -g status-right '#[fg=#D8A657]  #{=50:session_name}'
set -g status-right-length 60

set -g message-style fg="#D8A657",bg=default

set -g pane-border-style fg="#A89984"
set -g pane-active-border-style fg="#D8A657"

set -g window-style fg=default,bg=default
set -g window-active-style fg=default,bg=default

# Popup
bind t display-popup -w 80% -h 80% -T "Shell" -E "tmux-popup"

bind -T popup C-b switch-client -T popup-prefix
bind -T popup-prefix t run "tmux display-popup -c $(tmux list-clients -F '##{client_name}' | head -n 1) -C"
bind -T popup-prefix [ copy-mode
bind -T popup-prefix Any switch-client -T popup

# Bindings
set -g extended-keys on
set -g extended-keys-format csi-u
set-window-option -g mode-keys vi

unbind C-b
set -g prefix C-b
bind-key C-b send-prefix

unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display 'Reloaded config'

bind '"' run-shell '~/.config/tmux/scripts/split-window.sh -v'
bind % run-shell '~/.config/tmux/scripts/split-window.sh -h'
bind b run-shell '~/.config/tmux/scripts/select-layout.sh'
bind c new-window -c ~

bind-key -n C-h if -F "#{@pane-is-vim}" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if -F "#{@pane-is-vim}" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if -F "#{@pane-is-vim}" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if -F "#{@pane-is-vim}" 'send-keys C-l' 'select-pane -R'

bind-key -r h   if -F "#{@pane-is-vim}" 'send-keys M-h' 'resize-pane -L 5'
bind-key -r j   if -F "#{@pane-is-vim}" 'send-keys M-j' 'resize-pane -D 5'
bind-key -r k   if -F "#{@pane-is-vim}" 'send-keys M-k' 'resize-pane -U 5'
bind-key -r l   if -F "#{@pane-is-vim}" 'send-keys M-l' 'resize-pane -R 5'

bind-key -n C-S-h swap-window -d -t -1
bind-key -n C-S-l swap-window -d -t +1

# Plugins
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'mrjones2014/smart-splits.nvim'
set -g @smart-splits_no_wrap ''
set -g @smart-splits_resize_step '5'

set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'lazygit nvim opencode'

run-shell '~/.config/tmux/plugins/tpm/tpm'

